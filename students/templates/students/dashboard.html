<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <style>
            body {
                font-family: Arial;
                background: #f4f4f4;
                margin: 0;
            }
            .navbar {
                background: darkblue;
                color: white;
                padding: 15px;
                font-size: 25px;
            }
            .container {
                text-align: center;
                margin-top: 100px;
            }
            h1 {
                color: darkblue;
            }
            .card {
                width: 250px;
                background: white;
                margin: auto;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0px 0px 10px gray;
            }
            .btn {
                display: inline-block;
                margin: 10px;
                padding: 12px 20px;
                background: blue;
                color: white;
                text-decoration: none;
                border-radius: 5px;
            }
            .btn:hover {
                background: darkblue;
            }
        </style>
    </head>
    <body>
        <div class = "navbar">Student Dashboard</div>
        <div class = "container">
            <div class = "card">
                <h1>Welcome to the Dashboard</h1>
                <p>Here you can manage your students and courses.</p>
                <br>
                <a href="/addstudent/" class="btn">Add Student</a>
                <a href="/viewstudents/" class="btn">View Students</a>
            </div>
    </div>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Add Student</title> 
        <style>
            body {
                font-family: Arial;
                background: #f4f4f4;
            }
            .container {
                width: 400px;
                margin: 50px auto;
                background: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0px 0px 10px gray;
            }
            h1 {
                text-align: center;
                color: darkblue;
            }
            input {
                width: 100%;
                padding: 10px;
                margin-top: 10px;
                margin-bottom: 20px;
            }
            button {
                width: 100%;
                padding: 12px;
                background: blue;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 18px;
            }
            button:hover {
                background: darkblue;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Add Student Page</h1>
            <form>
                <input type="text" placeholder="Enter Name">
                <input type="number" placeholder="Enter Roll Number">
                <input type="text" placeholder="Enter Course">
                <input type="email" placeholder="Enter Email">
                <button type="submit">Save Student</button>
            </form>
        </div>
    </body>
</html>
